services:
  medastrax:
    build: .
    ports:
      - "8000:8000"
    environment:
      HC_STUDY_MODE: "true"
      HC_LOG_EVENTS: "true"
      HC_EXPERIMENTAL_CONDITION: baseline
      HC_ALLOW_LOGISTIC_FALLBACK: "false"
      HC_STABILITY_METHOD: bootstrap
      HC_BOOTSTRAP_ITERATIONS: "5"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./artifacts:/app/artifacts
      - ./study:/app/study
