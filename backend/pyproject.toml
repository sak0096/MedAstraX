[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hc-analytics"
version = "0.1.0"
description = "Healthcare analytics XAI research prototype"
requires-python = ">=3.12,<3.14"
# CI and Docker use Python 3.12 (.python-version).
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "structlog>=24.4",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "PyJWT[crypto]>=2.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "httpx2>=2.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hc_analytics = ["py.typed"]
